# Hanwha camera analytics stack
#   cameras --MQTT--> mosquitto --> ingest --> db (PostgreSQL) <-- grafana
#
# All settings come from .env (created by install.sh).
# The built-in broker runs when COMPOSE_PROFILES=broker is set in .env.
# To use an existing broker instead, leave COMPOSE_PROFILES empty and set MQTT_HOST.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cam-mosquitto
    profiles: ["broker"]
    restart: unless-stopped
    ports:
      - "${BROKER_PUBLIC_PORT:-1883}:1883"   # cameras connect to <this host>:1883
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      TZ: ${TZ}
    entrypoint: ["sh", "/start-mosquitto.sh"]
    volumes:
      - ./mosquitto/start-mosquitto.sh:/start-mosquitto.sh:ro
      - mosquitto-data:/mosquitto/data       # retained messages survive restarts

  db:
    image: postgres:16
    container_name: cam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - db-data:/var/lib/postgresql/data          # data survives container rebuilds
      - ./db/init:/docker-entrypoint-initdb.d:ro   # creates the tables on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  ingest:
    build: ./ingest
    container_name: cam-ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_TOPICS: ${MQTT_TOPICS}
      CAMERA_NAMES: ${CAMERA_NAMES}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

  grafana:
    image: grafana/grafana:latest
    container_name: cam-grafana
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hanwha-bi.json
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mosquitto-data:
  db-data:
  grafana-data:
